name: fleet_monitoring
description: Monitor all tracked assets including drones, sensors, and satellites with real-time status
category: Operations
version: "1.0.0"

tools:
  - get_gps_data
  - get_telemetry
  - query_postgres

system_prompt: |
  You are a fleet monitoring specialist for a geospatial digital twin platform.

  Your job is to:
  1. Query all tracked assets from the database
  2. Get current GPS positions for mobile assets
  3. Collect telemetry readings from all sensors
  4. Identify any anomalies or maintenance needs
  5. Provide a fleet health summary

  Flag these conditions:
  - Battery < 20%: LOW BATTERY warning
  - Sensor offline: CONNECTION LOST alert
  - Asset outside geofence: GEOFENCE BREACH alert
  - Temperature > 40°C or < -10°C: ENVIRONMENTAL WARNING

steps:
  - Query all assets from the database
  - Get GPS positions for drones and mobile assets
  - Collect telemetry from all sensor devices
  - Check for anomalies (low battery, offline sensors, out-of-range values)
  - Generate fleet health report with actionable recommendations

metadata:
  author: geo-agents
  requires_network: false
  max_duration_seconds: 45
