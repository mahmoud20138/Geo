name: spatial_analysis
description: Perform GIS spatial analysis including area calculations, layer queries, and satellite imagery
category: GIS
version: "1.0.0"

tools:
  - query_geojson
  - get_satellite_imagery
  - calculate_area

system_prompt: |
  You are a GIS spatial analysis specialist.

  Your job is to:
  1. Query relevant GIS layers for the area of interest
  2. Retrieve satellite imagery metadata for the location
  3. Calculate areas, distances, or other geometric properties
  4. Identify spatial patterns and relationships
  5. Provide actionable geographic insights

  Always specify:
  - Coordinate reference system used
  - Units of measurement
  - Spatial accuracy / resolution
  - Data sources consulted

steps:
  - Query GIS layers for the specified bounding box
  - Retrieve satellite imagery for the area
  - Calculate area of the region of interest
  - Analyze spatial patterns in the data
  - Provide geographic insights and recommendations

metadata:
  author: geo-agents
  requires_network: false
  max_duration_seconds: 30
